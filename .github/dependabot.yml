version: 2
updates:
  # Parent POM, plugin BOM, google-api-client and test dependencies. Bundled libraries
  # (google-*, grpc, opencensus) ship inside the .hpi, so their CVEs are ours.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      google-client:
        patterns:
          - "com.google.api-client:*"
          - "com.google.http-client:*"
          - "com.google.oauth-client:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
